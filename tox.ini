[tox]
envlist = py27, py35, py36, py37, py38, py39, py310, py311, py312, py313, py314, py315, pypy3

[testenv]
changedir = {envtmpdir}
commands_pre =
    {envpython} -c "import shutil; shutil.rmtree('tests', ignore_errors=True); shutil.copytree(r'{toxinidir}/tests', 'tests', ignore=shutil.ignore_patterns('__pycache__', '*.pyc'))"
commands = {envpython} -B -m unittest discover -v

[testenv:py]
basepython = {env:TOX_PYTHON:python}
extras = tests
commands = {[testenv:coverage]commands}

[testenv:coverage]
basepython = {env:TOX_PYTHON:python}
extras = tests
commands = {envpython} -m pytest --cov=olefile --cov=tests --cov-config={toxinidir}/.coveragerc --cov-report=html:{toxinidir}/htmlcov --cov-report=term --cov-report=xml:{toxinidir}/coverage.xml {posargs}

[testenv:pins]
changedir = {toxinidir}
extras =
    None
commands_pre =
    {envpython} -m pip install -r requirements.txt
commands = {[testenv:coverage]commands}
