[options.extras_require]
tests =
    pytest<5; python_version < "3"
    pytest<6.2; python_version >= "3" and python_version < "3.6"
    pytest<7; python_version >= "3.6" and python_version < "3.7"
    pytest<8; python_version >= "3.7" and python_version < "3.8"
    pytest<8.4; python_version >= "3.8" and python_version < "3.9"
    pytest; python_version >= "3.9"
    pytest-cov<3; python_version < "3.6"
    pytest-cov<5; python_version >= "3.6" and python_version < "3.7"
    pytest-cov<6; python_version >= "3.7" and python_version < "3.9"
    pytest-cov; python_version >= "3.9"

[bdist_wheel]
universal = 1

[metadata]
license_file = LICENSE.txt
