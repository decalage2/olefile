name: Test

on: [push, pull_request, workflow_dispatch]

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.10', 'pypy3.11', 'pypy3.12']
        os: [ubuntu-22.04, ubuntu-latest, windows-2022, windows-latest, macos-15-intel, macos-latest]
        exclude:
          # Python 3.7 has no Ubuntu 24.04 or macOS ARM build.
          - os: ubuntu-latest
            python-version: '3.7'
          - os: macos-latest
            python-version: '3.7'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            setup.cfg
            requirements-tox.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade -r requirements-tox.txt
      - name: Tox tests
        run: python -m tox -e coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }} Python ${{ matrix.python-version }}
  legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['2.7', '3.5', '3.6']
    steps:
      - uses: actions/checkout@v7
      - name: Test installed package on the legacy interpreter
        run: |
          version=${{ matrix.python }}
          tox_env=py${version/./}
          tar --exclude=.git --exclude=.tox -cf - . | \
            docker run --rm -i -w /src python:"$version" \
              sh -c "tar -xf - -C /src && \
                     python -m pip install --upgrade pip setuptools wheel && \
                     python -m pip install --upgrade -r requirements-tox.txt && \
                     python -m tox -e $tox_env"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install --upgrade -r doc/requirements.txt
      - run: python -m sphinx -W -b html doc /tmp/olefile-docs
